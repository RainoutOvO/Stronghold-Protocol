# Apache mTLS + WebSocket example for a private Stronghold deployment.
# Replace placeholders before use.

<VirtualHost *:80>
    ServerName game.example.com
    ProxyPass /.well-known/ !
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://game.example.com%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName game.example.com

    SSLEngine On
    SSLCertificateFile /path/to/site/fullchain.pem
    SSLCertificateKeyFile /path/to/site/privkey.pem

    # Client-certificate authentication.
    SSLCACertificateFile /path/to/stronghold/.mtls/ca.crt
    SSLVerifyClient require
    SSLVerifyDepth 2

    # Never trust a browser-provided identity header. Apache replaces it with
    # the serial from the client certificate that passed mTLS.
    RequestHeader unset X-Stronghold-Client-Serial
    RequestHeader set X-Stronghold-Client-Serial "expr=%{SSL:SSL_CLIENT_M_SERIAL}"

    <LocationMatch "^/\.mtls(?:/|$)">
        Require all denied
    </LocationMatch>

    ProxyPass /.well-known/ !

    <IfModule mod_proxy.c>
        ProxyRequests Off
        ProxyPreserveHost On

        # WebSocket must be listed before the generic root proxy.
        ProxyPass /ws ws://127.0.0.1:3000/ws
        ProxyPassReverse /ws ws://127.0.0.1:3000/ws

        ProxyPass / http://127.0.0.1:3000/
        ProxyPassReverse / http://127.0.0.1:3000/
    </IfModule>

    # Optional focused audit log: homepage and WebSocket establishment only.
    LogFormat "%{%Y-%m-%d %H:%M:%S}t | IP=%a | CN=\"%{SSL_CLIENT_S_DN_CN}x\" | SERIAL=%{SSL_CLIENT_M_SERIAL}x | VERIFY=%{SSL_CLIENT_VERIFY}x | TLS=%{SSL_PROTOCOL}x | CIPHER=%{SSL_CIPHER}x | METHOD=%m | URI=\"%U\" | STATUS=%>s | BYTES=%B | TIME_US=%D | UA=\"%{User-Agent}i\"" stronghold_mtls
    SetEnvIf Request_URI "^/$" stronghold_mtls_request
    SetEnvIf Request_URI "^/ws$" stronghold_mtls_request
    CustomLog "/path/to/logs/stronghold-mtls.log" stronghold_mtls env=stronghold_mtls_request
</VirtualHost>
